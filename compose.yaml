name: galene

x-common: &common
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:mode=1777,size=64m"]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

x-backend: &backend
  <<: *common
  image: galene-backend:${GALENE_IMAGE_TAG:-local}
  build: {context: ./backend, target: runtime}
  user: "${GALENE_UID:-1000}:${GALENE_GID:-1000}"
  environment:
    GALENE_APP_ENV: ${GALENE_APP_ENV:-development}
    GALENE_STORAGE_DIR: /data
  volumes:
    - type: bind
      source: ${GALENE_DATA_DIR:-./data}/db
      target: /data/db
      bind: {create_host_path: false}
    - type: bind
      source: ${GALENE_DATA_DIR:-./data}/media
      target: /data/media
      bind: {create_host_path: false}

services:
  migrate:
    <<: *backend
    restart: "no"
    command: [python, -m, app.migrate]
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 15s
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, app.worker.health]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
  frontend:
    <<: *common
    image: galene-frontend:${GALENE_IMAGE_TAG:-local}
    build: {context: ./frontend, target: runtime}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 6
  nginx:
    <<: *common
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    ports: ["127.0.0.1:${GALENE_PORT:-8080}:8080"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/edge-health]
      interval: 5s
      timeout: 3s
      retries: 6
  backend-check:
    profiles: [tools]
    build: {context: ./backend, target: check}
    command: [sh, -c, "ruff check . && ruff format --check . && mypy && pytest -q"]
  frontend-check:
    profiles: [tools]
    build: {context: ./frontend, target: tooling}
    command: [sh, -c, "npm run check && npm run build"]

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 21m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Variables force Docker DNS re-resolution when a service is recreated.
    set $api http://api:8000;
    set $frontend http://frontend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /edge-health { access_log off; return 200 'ok'; }
    location = /health { return 404; }
    location ^~ /health/ { return 404; }
    location = /openapi.json { return 404; }
    location = /api { proxy_pass $api$request_uri; }
    location /api/ { proxy_pass $api$request_uri; }
    location / { proxy_pass $frontend$request_uri; }
}
